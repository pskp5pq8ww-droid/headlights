<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shining Headlights Special Offer Meta Creatives</title>
    <link rel="stylesheet" href="./special-offer-meta-creatives.css" />
  </head>
  <body>
    <main class="creative-board" aria-label="Meta ad creative previews">
      <section
        id="creative-01-special-offer-promo-feed"
        class="ad ad-square promo-feed"
        aria-label="Special offer promo feed ad"
      >
        <div class="photo-layer" aria-hidden="true"></div>
        <div class="shade-layer" aria-hidden="true"></div>

        <header class="brand-strip">
          <img src="../assets/logo-clean.png" alt="Shining Headlights Australia" />
        </header>

        <div class="sale-panel">
          <p class="kicker">Special Offer - Limited Time Only</p>
          <h1>Special Offer</h1>
          <p class="subline">Mobile Headlight Restoration</p>

          <div class="price-lockup" aria-label="Offer price from 99 dollars">
            <span class="from">From</span>
            <span class="price">$99</span>
          </div>

          <div class="saving-row">
            <span>Was $220</span>
            <strong>Save $121</strong>
          </div>

          <p class="support">We come to you anywhere in Brisbane.</p>
        </div>

        <div class="result-tags" aria-hidden="true">
          <span>Before</span>
          <span>After</span>
        </div>

        <footer class="cta-bar">
          <span>Claim Special Offer</span>
          <small>shiningaus.com</small>
        </footer>
      </section>
    </main>
  </body>
</html>
