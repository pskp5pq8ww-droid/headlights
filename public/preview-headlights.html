<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Headlights Hero Preview</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
      body { margin: 0; }
      .site-header { display: none; }
      .eofy-landing-hero { min-height: 100vh; }
    </style>
  </head>
  <body class="landing-home">
    <section class="eofy-landing-hero" id="home" aria-labelledby="hero-title">
      <div class="hero-video-bg" aria-hidden="true">
        <video autoplay muted loop playsinline preload="metadata">
          <source src="/assets/video/headlights-hero-loop.mp4" type="video/mp4">
        </video>
      </div>
      <div class="hero-video-overlay" aria-hidden="true"></div>
      <div class="hero-ambient" aria-hidden="true"></div>

      <div class="container eofy-landing-inner">
        <div class="eofy-hero-copy">
          <span class="sale-pill reveal">EOFY Sale</span>
          <h1 id="hero-title" class="reveal">$99 Headlight<br>Restoration</h1>
          <p class="hero-direct reveal">Save $50 <span>Offer Ends Soon</span></p>

          <div class="eofy-countdown-card reveal" aria-label="EOFY offer countdown">
            <p>Offer ends in</p>
            <div class="countdown landing-countdown">
              <span><strong>00</strong><small>Days</small></span>
              <span><strong>00</strong><small>Hours</small></span>
              <span><strong>00</strong><small>Minutes</small></span>
              <span><strong>00</strong><small>Seconds</small></span>
            </div>
          </div>

          <div class="eofy-price reveal">
            <span class="was-price">$149</span>
            <strong>$99</strong>
            <span class="save-pill">Save $50</span>
          </div>

          <a class="button button-primary eofy-main-cta reveal" href="/book">
            <span>Claim EOFY Offer</span>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
